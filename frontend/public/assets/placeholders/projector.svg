  <line x1="42" y1="42" x2="58" y2="42" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="46" x2="58" y2="46" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
