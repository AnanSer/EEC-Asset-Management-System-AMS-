  <rect x="22" y="36" width="14" height="14" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="29" cy="43" r="5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="28" cy="42" r="2" fill="#FFFFFF" opacity="0.9"/>
