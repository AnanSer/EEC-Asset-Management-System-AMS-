<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <rect width="80" height="80" rx="16" fill="#F1F5F9"/>
  <!-- Monitor Outer Bezel -->
  <rect x="14" y="18" width="52" height="34" rx="3" fill="#0B2545" stroke="#134074" stroke-width="2"/>
  <!-- Glass Screen -->
  <rect x="17" y="21" width="46" height="28" rx="1.5" fill="#1E293B"/>
  <!-- Screen Graphic -->
  <rect x="22" y="26" width="16" height="12" rx="1" fill="#134074"/>
  <rect x="42" y="26" width="16" height="5" rx="1" fill="#ECA72C" opacity="0.8"/>
  <rect x="42" y="33" width="12" height="5" rx="1" fill="#64748B"/>
  <!-- Power LED -->
  <circle cx="40" cy="50" r="1" fill="#10B981"/>
  <!-- Stand Neck -->
  <rect x="37" y="52" width="6" height="8" fill="#475569"/>
  <!-- Stand Base -->
  <rect x="28" y="60" width="24" height="3" rx="1.5" fill="#334155"/>
</svg>
