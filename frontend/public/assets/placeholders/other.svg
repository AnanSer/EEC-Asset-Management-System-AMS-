<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <rect width="80" height="80" rx="16" fill="#F1F5F9"/>
  <!-- Hardware Chip / Component Base -->
  <rect x="22" y="22" width="36" height="36" rx="6" fill="#0B2545" stroke="#134074" stroke-width="2"/>
  <!-- Central EEC Core -->
  <rect x="30" y="30" width="20" height="20" rx="3" fill="#1E293B" stroke="#ECA72C" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="4" fill="#ECA72C"/>
  <!-- Component Pins Top & Bottom -->
  <line x1="28" y1="18" x2="28" y2="22" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="18" x2="36" y2="22" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="18" x2="44" y2="22" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="18" x2="52" y2="22" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="58" x2="28" y2="62" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="58" x2="36" y2="62" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="58" x2="44" y2="62" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="58" x2="52" y2="62" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <!-- Component Pins Left & Right -->
  <line x1="18" y1="28" x2="22" y2="28" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="36" x2="22" y2="36" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="44" x2="22" y2="44" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="52" x2="22" y2="52" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="28" x2="62" y2="28" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="36" x2="62" y2="36" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="62" y2="44" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="52" x2="62" y2="52" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
</svg>
